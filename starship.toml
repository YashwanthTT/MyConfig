format = """
$directory\
[]()\
[]()\
\n$character"""

right_format = "$git_branch"

[directory]
style = "fg:#5ea1ff"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "~/"

[git_branch]
symbol = ""
style = "bg:#16181a"
format = '[[ $symbol $branch ](fg:#5ea1ff bg:#222834)]($style)'
