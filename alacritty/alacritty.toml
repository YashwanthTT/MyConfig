general.import = [
    "~/.config/alacritty/themes/moonfly.toml"
]


[colors]
#
# primary = { background = "#08080B", foreground = "#d8d8d8" }
primary = { background = "#202632", foreground = "#d8d8d8" }

[window]
padding.x = 3
padding.y = 2
decorations = "buttonless"
# opacity = 0.99
opacity = 0.95
blur = true
option_as_alt = "both"
startup_mode = "Maximized"

[font]
normal.family = "JetBrainsMono Nerd Font Mono"
# normal.family = "meslolgs nerd font mono"
size = 18

