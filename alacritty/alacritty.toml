general.import = [
    "~/.config/alacritty/themes/tokyonight.toml"
]

[colors]
primary = { background = "#1a1b26", foreground = "#c0caf5"}
cursor = { cursor = "#c0caf5" }

[window]
decorations = "buttonless"
padding.x = 2
padding.y = 2
opacity = 0.95
blur = true
option_as_alt = "both"
startup_mode = "Maximized"

[font]
bold.family = "JetBrainsMono Nerd Font Mono"
bold.style = "Bold"
normal.family = "JetBrainsMono Nerd Font Mono"
normal.style = "Bold"
size = 18.5
